[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Headers valem para os arquivos estáticos. O embed valida o domínio por document.referrer,
# então o Referrer-Policy NÃO pode ser no-referrer.
# Google Cast (Chromecast): cada origem de script/connect abaixo foi pedida pelo console quando o SDK/framework REAL
# rodou sob esta CSP (Chrome 154 com interface).
#   - www.gstatic.com: SDK do remetente (app.js) e framework do receptor (receiver.html).
#   - ajax.googleapis.com: o framework do receptor carrega o Shaka Player.
#   - ws://localhost:8008: canal do receptor com o próprio Chromecast (/v2/ipc). Sem ele o receptor quebra NA TV, sem aviso.
#   - https://image.tmdb.org em connect-src: o service worker (sw.js) guarda os pôsteres, e o fetch() de dentro dele obedece
#     ao connect-src (não ao img-src). Sem isso TODO pôster falha em silêncio (net::ERR_FAILED, sem aviso de CSP no console).
#     Verificado no Chrome real: sem a origem, 0 pôsteres carregam; com ela, carregam e o cache enche.
# As versões http:// existem porque o SDK monta as URLs com o protocolo da página (http://localhost no netlify dev);
# em produção (https) o navegador já bloqueia http. A CSP é uma só para o site todo: um segundo header em
# /receiver.html não afrouxaria nada (CSPs se somam como interseção).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self' https://www.gstatic.com http://www.gstatic.com https://ajax.googleapis.com http://ajax.googleapis.com; style-src 'self'; img-src 'self' data: https://image.tmdb.org; connect-src 'self' https://image.tmdb.org ws://localhost:8008; manifest-src 'self'; worker-src 'self'; frame-src https://embedplayapi.top; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex, nofollow"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

# Páginas da TV e do receptor do Chromecast: TV antiga guarda arquivo em cache por conta própria (mesmo com ETag) e
# ficaria rodando o tv.js velho depois de uma correção. Aqui nada é guardado: são poucos KB por abertura da página.
# (Em tv.html/receiver.html as URLs dos scripts também levam ?v=N: troque o número ao mexer neles.)
[[headers]]
  for = "/tv*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/receiver*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
