  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<body class="anon">
  <header class="topbar">
    <a class="brand" href="#/">Cine<span>Local</span></a>
    <nav class="nav" id="nav">
      <a href="#/" data-route="home">Início</a>
      <a href="#/lista/library-movies" data-route="library-movies">Filmes</a>

    <form class="search" id="search-form" role="search">
      <input id="search" type="search" placeholder="Buscar filmes e séries" autocomplete="off" aria-label="Buscar filmes e séries">

    <div class="user" id="user">

  <main id="app" aria-live="polite"></main>
  <footer class="footer">
    <p class="footer-about"><strong>Cine<span>Local</span></strong> · Catálogo de filmes e séries com acesso liberado por aprovação do administrador.</p>

  </footer>
  <script src="app.js"></script>
