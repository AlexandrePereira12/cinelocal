<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Cine Local</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e50914'/%3E%3Cpath d='M12 9l11 7-11 7z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body class="anon">
  <header class="topbar">
    <a class="brand" href="#/">Cine<span>Local</span></a>
    <nav class="nav" id="nav">
      <a href="#/" data-route="home">Início</a>
      <a href="#/lista/library-movies" data-route="library-movies">Filmes</a>
      <a href="#/lista/library-shows" data-route="library-shows">Séries</a>
      <a href="#/lista/top-movies" data-route="top-movies">Mais avaliados</a>
      <a href="#/lista/recent-movies" data-route="recent-movies">Lançamentos</a>
      <a href="#/biblioteca" data-route="library">Minha lista</a>

    <form class="search" id="search-form" role="search">
      <input id="search" type="search" placeholder="Buscar filmes e séries" autocomplete="off" aria-label="Buscar filmes e séries">
    </form>
    <div class="user" id="user">
      <span class="user-name" id="user-name"></span>
      <button class="btn small" id="logout" type="button">Sair</button>
    </div>
  </header>
  <main id="app" aria-live="polite"></main>
  <footer class="footer"><a href="#/creditos">Créditos</a></footer>
  <script src="app.js"></script>
</body>
</html>
